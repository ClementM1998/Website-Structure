<!doctype html>

  <head>

          </div>

          <div class="grid-box">
            <span class="rank">3</span>

            <p>90 sold</p>
          </div>

          <div class="grid-box">
            <span class="rank">4</span>
            <p>Produk D</p>
            <p>80 sold</p>
          </div>

          <div class="grid-box">
            <span class="rank">5</span>
            <p>Produk E</p>
            <p>50 sold</p>
          </div>

          <div class="grid-box">
            <span class="rank">6</span>
            <p>Produk F</p>
            <p>30 sold</p>
          </div>
        </div>
        <button class="scroll-btn right" onclick="moveRight()">&#10095;</button>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <div id="menu" class="right-menu">
          <a href="index.html">Home</a>

</html>
